[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parltopic"
version = "0.1.0"
description = "Apertus-powered multilingual topic classification for OpenParlData"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "streamlit>=1.39,<2",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
report = [
  "markdown>=3.5,<4",
  "pypdf>=4,<6",
]
experiments = [
  "scikit-learn>=1.5,<2",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
parltopic = "parltopic.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/parltopic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.ruff.lint.per-file-ignores]
# Report builder: CSS and the HTML shell are long string literals.
"docs/build_report_pdf.py" = ["E501"]
