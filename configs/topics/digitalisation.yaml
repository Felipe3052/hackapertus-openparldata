  - online
  - NFT
positive_examples:
  - Einführung einer elektronischen Identität für kantonale Dienstleistungen.
  - Digitale Einreichung und Verarbeitung von Behördengesuchen.
  - Schutz kritischer Infrastrukturen vor Cyberangriffen.
  - Kredit für die Erneuerung der Informatik bzw. eines ERP-Systems der Verwaltung.
  - Umgang mit KI-Werkzeugen wie ChatGPT an Schulen.
  - Ausbau von Glasfaser oder 5G-Mobilfunk.
  - Tätigkeitsbericht der Datenschutzaufsicht.
  - Mobile Arbeit und Homeoffice, wenn digitale Arbeitsformen geregelt werden.
  - Regulierung von Online-Buchungsplattformen und digitalem Konsum.
  - Finanzierung oder Migration von SAP-, ERP-, Software- oder Verwaltungssystemen.
  - Statistik, Geodaten oder Messindikatoren, wenn Datenerhebung und -verarbeitung zentral sind.
  - Réglementation des plateformes en ligne, des contenus numériques ou de la désinformation.
  - Regolamentazione di piattaforme online, commercio elettronico e servizi digitali.
  - Applicazioni online come strumento per accedere ad alloggi o servizi pubblici.
  - Incitamento all'odio e discriminazione su Internet o sulle piattaforme sociali.
negative_examples:
  - Sanierung einer Kantonsstrasse ohne digitalen Bezug.
  - Finanzierung eines konventionellen Schulgebäudes.
  - Rentenreform ohne Bezug zu digitalen Prozessen.
