  - protection des données
  - digitalizzazione
  - digitale
  - identità elettronica
  - informatica
  - cibersicurezza
  - intelligenza artificiale
  - protezione dei dati
positive_examples:
  - Einführung einer elektronischen Identität für kantonale Dienstleistungen.
  - Digitale Einreichung und Verarbeitung von Behördengesuchen.
  - Schutz kritischer Infrastrukturen vor Cyberangriffen.
  - Kredit für die Erneuerung der Informatik bzw. eines ERP-Systems der Verwaltung.
  - Umgang mit KI-Werkzeugen wie ChatGPT an Schulen.
  - Ausbau von Glasfaser oder 5G-Mobilfunk.
  - Tätigkeitsbericht der Datenschutzaufsicht.
negative_examples:
  - Sanierung einer Kantonsstrasse ohne digitalen Bezug.
  - Finanzierung eines konventionellen Schulgebäudes.
  - Rentenreform ohne Bezug zu digitalen Prozessen.
