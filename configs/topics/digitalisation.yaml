topic_id: digitalisation
name: Digitalisierung
# Scope follows the PolitMonitor editorial tag behind the DVS list (see data/raw/README.md):
# e-government, cybersecurity, AI, data protection, digital media and broadband.
# v4 (merge): Felipe's v3 side-aspect rule (E1.6) plus Josip's v3 multilingual scope examples
# and the online/NFT terms. All changes come from error analysis on the dev split (2018-2023).
description: >-
  Parlamentarische Geschäfte zur digitalen Transformation von Staat, Wirtschaft und
  Gesellschaft: digitale Verwaltung und E-Government, elektronische Identität,
  Informatik, IT-Projekte, Software und IT-Infrastruktur der Verwaltung, Cybersicherheit,
  künstliche Intelligenz und Automatisierung, Datenschutz und Datennutzung, Geodaten,
  digitale Medien, Plattformen und Desinformation, Breitband, Mobilfunk und 5G,
  Digitalisierung in Bildung, Gesundheit und Wirtschaft.
  Regel: Ordne das Thema zu, sobald digitale Technologie, Informatik, Daten, Online-Dienste,
  Online-Plattformen, Überwachungstechnologie oder Telekommunikation im Geschäft eine Rolle
  spielt, auch als Nebenaspekt einer Vorlage aus einem anderen Politikfeld (z. B. eine
  Konsumentenschutz- oder Arbeitsrechtsvorlage, die Online-Buchungen oder Homeoffice regelt),
  und auch wenn nur der Titel vorliegt. Verwende not_assigned nur, wenn kein digitaler Bezug
  erkennbar ist; bei einem möglichen, aber unklaren Bezug verwende uncertain.
synonyms:
  - Digitalisierung
  - digital
